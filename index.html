<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meeting Assistant</title>
</head>
<body>
  <h1>Meeting Assistant</h1>

  <p>Загрузите аудио или видео встречи. Результат придет в Telegram.</p>

  <input type="file" id="fileInput" accept=".mp3,.mp4,.m4a,.wav,.webm,.ogg,.oga,.mpeg,.mpga,.flac,audio/*,video/*" />

  <br><br>

  <button onclick="sendFile()">Отправить на обработку</button>

  <p id="status"></p>

  <script>
    const SUPABASE_URL = "https://vaddfiksldaebnzaccks.supabase.co";

    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZhZGRmaWtzbGRhZWJuemFjY2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTI4NjEsImV4cCI6MjA5NTYyODg2MX0.VX7U-D1_syZLraknk5drh1Ctl23F6HpADo7d_HhUJiQ";

    const N8N_WEBHOOK_URL = "https://zarubinscky.app.n8n.cloud/webhook/process-meeting";

    const TELEGRAM_CHAT_ID = "65446025";

    function setStatus(text) {
      document.getElementById("status").innerText = text;
    }

    function makeSafeFileName(originalName) {
      const extension = originalName.split(".").pop() || "file";
      return `meeting-${Date.now()}.${extension}`;
    }

    async function sendFile() {
      try {
        const file = document.getElementById("fileInput").files[0];

        if (!file) {
          alert("Выберите файл");
          return;
        }

        setStatus("Загрузка файла в хранилище...");

        const fileName = makeSafeFileName(file.name);

        const uploadUrl = `${SUPABASE_URL}/storage/v1/object/meetings/${fileName}`;

        const uploadResponse = await fetch(uploadUrl, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": file.type || "application/octet-stream"
          },
          body: file
        });

        if (!uploadResponse.ok) {
          const errorText = await uploadResponse.text();
          console.error("Supabase upload error:", errorText);
          setStatus("Ошибка загрузки файла в Supabase");
          return;
        }

        const fileUrl = `${SUPABASE_URL}/storage/v1/object/public/meetings/${fileName}`;

        setStatus("Файл загружен. Запускаю обработку...");

        const webhookResponse = await fetch(N8N_WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            file_url: fileUrl
          })
        });

        if (!webhookResponse.ok) {
          const errorText = await webhookResponse.text();
          console.error("n8n webhook error:", errorText);
          setStatus("Файл загружен, но не удалось запустить обработку");
          return;
        }

        setStatus("Готово. Обработка началась. Результат придет в Telegram.");

      } catch (error) {
        console.error(error);
        setStatus("Ошибка. Посмотрите консоль браузера.");
      }
    }
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
  
</body>
</html>
